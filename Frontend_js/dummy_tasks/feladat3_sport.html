    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #1a1a2e; border-left: 4px solid #2d6a4f; padding-left: 0.75rem; }

    .stat-card { background: white; border-radius: 12px; padding: 1.25rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .stat-card label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; display: block; margin-bottom: 0.4rem; }
    .stat-card span { font-size: 1.4rem; font-weight: 700; color: #2d6a4f; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 0.5rem 0.75rem; background: #f8f9fa; color: #555; font-weight: 600; border-bottom: 2px solid #e9ecef; }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    .right { display: flex; flex-direction: column; gap: 1rem; }
  </style>
</head>
