<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>2. Feladat – Iskolai jegyek megoszlása</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; padding: 2rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #1a1a2e; border-left: 4px solid #e63946; padding-left: 0.75rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
    .chart-box { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .stats { display: flex; flex-direction: column; gap: 1rem; }
    .stat-card { background: white; border-radius: 12px; padding: 1.25rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .stat-card label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; display: block; margin-bottom: 0.4rem; }
    .stat-card span { font-size: 1.5rem; font-weight: 700; color: #e63946; }
  </style>
</head>
<body>
<div class="container">
  <h1>2. Feladat – Iskolai jegyek megoszlása</h1>

  <div class="layout">
    <div class="chart-box">
      <canvas id="myChart"></canvas>
    </div>

    <div class="stats">
      <div class="stat-card">
        <label>Osztály átlaga</label>
        <span id="atlag">–</span>
      </div>
      <div class="stat-card">
        <label>Leggyakoribb jegy</label>
        <span id="leggyakoribb">–</span>
      </div>
      <div class="stat-card">
        <label>Bukások száma (1-es)</label>
        <span id="bukasok">–</span>
      </div>
      <div class="stat-card">
        <label>Átment (≥2) arány</label>
        <span id="atment">–</span>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // ADATOK – ne módosítsd!
  // ============================================================
  const jegyek = [5,3,4,5,2,4,3,5,4,4,1,3,5,2,4,5,3,4,5,4,2,3,4,5,5,3,4,2,5,4];

  let osszegek = [
  ];

  let egyOsszeg = 0;
  let kettoOsszeg = 0;
  let haromOsszeg = 0;
  let negyOsszeg = 0;
  let otOsszeg = 0;
  let atmentCounter = 0;

  jegyek.forEach(element => {
    switch(element){
      case 1:
        egyOsszeg++;
        break;
      case 2:
        kettoOsszeg++;
        break;
      case 3:
        haromOsszeg++;
        break;
      case 4:
        negyOsszeg++;
        break;
      case 5:
        otOsszeg++;
        break;
    }
    if(element > 1){
      atmentCounter++;
    }
  });

  osszegek.push(egyOsszeg, kettoOsszeg, haromOsszeg, negyOsszeg, otOsszeg);

  let maxDarab = Math.max(egyOsszeg,kettoOsszeg,haromOsszeg,negyOsszeg,otOsszeg);

    if (maxDarab === egyOsszeg) leggyakoribbJegy = "1-es";
    else if (maxDarab === kettoOsszeg) leggyakoribbJegy = "2-es";
    else if (maxDarab === haromOsszeg) leggyakoribbJegy = "3-es";
    else if (maxDarab === negyOsszeg) leggyakoribbJegy = "4-es";
    else if (maxDarab === otOsszeg) leggyakoribbJegy = "5-ös";

    function Average(array){
    let counter = 0;
    let all = 0;
    array.forEach(element => {
      counter++;
      all += element;
    });
    let eredmeny = all/counter;
    return eredmeny.toFixed(2);
  }



  let atlagok = Average(jegyek);
  document.getElementById('atlag').textContent = atlagok;
  document.getElementById('leggyakoribb').textContent = leggyakoribbJegy;
  document.getElementById('bukasok').textContent = egyOsszeg;
  document.getElementById('atment').textContent = atmentCounter;
 
  

  // ============================================================
  // CHART INICIALIZÁLÁS – ne módosítsd!
  // ============================================================
  
  const ctx = document.getElementById('myChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['Elégtelen (1)', 'Elégséges (2)', 'Közepes (3)', 'Jó (4)', 'Jeles (5)'],
      datasets: [{
        data: osszegek,    // TODO 1: töltsd fel a kiszámított darabszámokkal [db1, db2, db3, db4, db5]
        backgroundColor: ['#e63946','#f4a261','#e9c46a','#2a9d8f','#457b9d'],
        borderWidth: 2,
        borderColor: '#f0f2f5',
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' }
      }
    }
  });


  // ============================================================
  // FELADATOK – itt dolgozz!
  // ============================================================

  // TODO 1: Ciklussal számold meg az 1-es, 2-es, 3-as, 4-es, 5-ös jegyek számát!
  // Töltsd fel a chart data tömbjét! (sorrend: [db1, db2, db3, db4, db5])
  // let darabszamok = [0, 0, 0, 0, 0];
  // for (...) { ... }
  // chart.data.datasets[0].data = darabszamok;
  // chart.update();

  // TODO 2: Számítsd ki ciklussal a jegyek átlagát (2 tizedesjegy)!
  // Írd ki a #atlag elembe!
  // document.getElementById('atlag').textContent = ...

  // TODO 3: Keresd meg a leggyakoribb jegyet!
  // Írd ki a #leggyakoribb elembe (pl. "5-ös")!

  // TODO 4: Írd ki a #bukasok elembe, hány 1-es jegy van!
  // document.getElementById('bukasok').textContent = ...

  // TODO 5: Számítsd ki, hány % a jegyek közül >= 2 (2 tizedesjegy)!
  // Írd ki a #atment elembe (pl. "96.67%")!
  // document.getElementById('atment').textContent = ...
</script>
</body>
</html>
