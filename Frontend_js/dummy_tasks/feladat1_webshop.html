<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>1. Feladat – Webshop havi forgalom</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; padding: 2rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #1a1a2e; border-left: 4px solid #4361ee; padding-left: 0.75rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .chart-box { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: white; border-radius: 12px; padding: 1.25rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .stat-card label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; display: block; margin-bottom: 0.4rem; }
    .stat-card span { font-size: 1.5rem; font-weight: 700; color: #4361ee; }
    .wide { grid-column: 1 / -1; }
    .wide span { font-size: 1rem; color: #333; font-weight: 500; }
  </style>
</head>
<body>
<div class="container">
  <h1>1. Feladat – Webshop havi forgalom</h1>

  <div class="chart-box">
    <canvas id="myChart" height="100"></canvas>
  </div>

  <div class="stats">
    <div class="stat-card">
      <label>Éves összes rendelés</label>
      <span id="osszesen">–</span>
    </div>
    <div class="stat-card">
      <label>Legjobb hónap</label>
      <span id="legjobb">–</span>
    </div>
    <div class="stat-card">
      <label>Havi átlag</label>
      <span id="atlag">–</span>
    </div>
    <div class="stat-card wide">
      <label>Átlag feletti hónapok</label>
      <span id="atlag-feletti">–</span>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // ADATOK – ne módosítsd!
  // ============================================================
  const honapok   = ["Jan","Feb","Már","Ápr","Máj","Jún","Júl","Aug","Szep","Okt","Nov","Dec"];
  const rendelesek = [142, 98, 175, 203, 187, 224, 310, 289, 198, 245, 312, 401];

  // ============================================================
  // CHART INICIALIZÁLÁS – ne módosítsd!
  // ============================================================
  const ctx = document.getElementById('myChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: honapok,      // TODO 1: töltsd fel a honapok tömb elemeivel
      datasets: [{
        label: 'Rendelések száma',
        data: rendelesek,      // TODO 2: töltsd fel a rendelesek tömb elemeivel
        backgroundColor: 'rgba(67, 97, 238, 0.75)',
        borderColor: '#4361ee',
        borderWidth: 2,
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true } }
    }
  });

  
let evesRendelesek = 0;
for(var rend of rendelesek){
  evesRendelesek += rend;
}

function myArrayMax(arr) {
  let len = arr.length;
  let max = -Infinity;

  while (len--) {
    if (arr[len] > max) {
      max = arr[len];
    }
  }
  return max;
}

function AverageSales(array){
  let counter = 0;
  let all = 0;
  array.forEach(element => {
    counter++;
    all += element;
  });
  let eredmeny = all/counter;
  return eredmeny;
}

  const osszes = document.getElementById('osszesen');
  osszes.textContent = evesRendelesek.toString();

  document.getElementById("legjobb").innerHTML = myArrayMax(rendelesek);

  document.getElementById("atlag").innerHTML = AverageSales(rendelesek);

</script>
</body>
</html>
